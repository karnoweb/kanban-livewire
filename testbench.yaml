providers:
  - Livewire\LivewireServiceProvider
  - Karnoweb\Kanban\KanbanServiceProvider
  - Laravel\Reverb\ReverbServiceProvider
  - Workbench\App\Providers\KanbanBoardServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\KanbanDemoSeeder

env:
  - APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  - APP_ENV=local
  - APP_DEBUG=true
  - SESSION_DRIVER=file
  - QUEUE_CONNECTION=sync
  - CACHE_STORE=file
  - BROADCAST_CONNECTION=reverb
  - REVERB_APP_ID=kanban
  - REVERB_APP_KEY=kanban-key
  - REVERB_APP_SECRET=kanban-secret
  - REVERB_HOST=127.0.0.1
  - REVERB_PORT=8081
  - REVERB_SCHEME=http
  - REVERB_SERVER_HOST=127.0.0.1
  - REVERB_SERVER_PORT=8081

workbench:
  start: /tasks
  install: false
  discovers:
    web: true
    api: false
    commands: false
    views: true
